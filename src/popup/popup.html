<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actual AI</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    body {
      width: 300px;
      padding: 20px;
    }

    .popup-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .popup-header svg {
      width: 24px;
      height: 24px;
      color: var(--accent-blue);
    }

    .popup-header h1 {
      font-size: 16px;
    }

    .popup-header .ai-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      border-radius: var(--radius-full);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12px;
    }

    .status-row:last-child { border-bottom: none; }

    .actions {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
      <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
      <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
    </svg>
    <h1>Actual</h1>
    <span class="ai-badge">AI</span>
  </div>

  <div id="statusList">
    <div class="status-row">
      <span class="text-secondary">Gemini AI</span>
      <span class="badge badge-muted" id="popupGemini">Checking...</span>
    </div>
    <div class="status-row">
      <span class="text-secondary">Actual Budget</span>
      <span class="badge badge-muted" id="popupActual">Checking...</span>
    </div>
    <div class="status-row">
      <span class="text-secondary">Statements Imported</span>
      <span class="text-mono" id="popupCount">-</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary w-full" id="openSidePanel">
      Open Side Panel
    </button>
    <button class="btn btn-secondary w-full" id="openOptions">
      Settings
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
